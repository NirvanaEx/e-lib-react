version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    # Порт наружу не публикуем: до API достаточно достучаться из web по
    # внутренней сети. Наружу торчит только сам фронт.
    expose:
      - "${APP_PORT:-3001}"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Относительный путь, а не абсолютный с IP: браузер зовёт /api у того же
        # адреса, откуда взял страницу, а nginx фронта проксирует внутрь.
        VITE_API_URL: ${VITE_API_URL:-/api}
    restart: unless-stopped
    environment:
      APP_PORT: ${APP_PORT:-3001}
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-elib}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elib}
      POSTGRES_DB: ${DB_NAME:-elib}
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
