version: "3.9"
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3001}:${APP_PORT:-3001}"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      - db
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3001/api}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - api
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-elib}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-elib}
      POSTGRES_DB: ${DB_NAME:-elib}
    volumes:
      - db_data:/var/lib/postgresql/data
volumes:
  db_data:
